<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

<ui:composition template="/templates/template.xhtml">
    <ui:define name="title">Tableau de Bord - Système de Facturation</ui:define>
    
    <ui:define name="content">
        <h:form id="dashboardForm">
            <p:panel header="Tableau de Bord">
                <p:commandButton value="Rafraîchir" 
                               icon="pi pi-refresh" 
                               action="#{dashboardBean.rafraichir}"
                               ajax="false"
                               update="dashboardForm"
                               styleClass="ui-button-success"/>
                
                <!-- Indicateurs clés -->
                <div class="dashboard-kpis">
                    <div class="kpi-card">
                        <div class="kpi-icon">💰</div>
                        <div class="kpi-content">
                            <h3>CA du Mois</h3>
                            <p class="kpi-value">
                                <h:outputText value="#{dashboardBean.caMois}">
                                    <f:convertNumber type="currency" currencySymbol="€"/>
                                </h:outputText>
                            </p>
                        </div>
                    </div>
                    
                    <div class="kpi-card">
                        <div class="kpi-icon">📈</div>
                        <div class="kpi-content">
                            <h3>CA de l'Année</h3>
                            <p class="kpi-value">
                                <h:outputText value="#{dashboardBean.caAnnee}">
                                    <f:convertNumber type="currency" currencySymbol="€"/>
                                </h:outputText>
                            </p>
                        </div>
                    </div>
                    
                    <div class="kpi-card">
                        <div class="kpi-icon">📄</div>
                        <div class="kpi-content">
                            <h3>Total Factures</h3>
                            <p class="kpi-value">#{dashboardBean.nbFacturesTotal}</p>
                        </div>
                    </div>
                    
                    <div class="kpi-card warning">
                        <div class="kpi-icon">⚠️</div>
                        <div class="kpi-content">
                            <h3>Factures en Retard</h3>
                            <p class="kpi-value">#{dashboardBean.nbFacturesEnRetard}</p>
                        </div>
                    </div>
                    
                    <div class="kpi-card danger">
                        <div class="kpi-icon">💸</div>
                        <div class="kpi-content">
                            <h3>Montant Impayé</h3>
                            <p class="kpi-value">
                                <h:outputText value="#{dashboardBean.montantImpaye}">
                                    <f:convertNumber type="currency" currencySymbol="€"/>
                                </h:outputText>
                            </p>
                        </div>
                    </div>
                    
                    <div class="kpi-card">
                        <div class="kpi-icon">👥</div>
                        <div class="kpi-content">
                            <h3>Clients Actifs</h3>
                            <p class="kpi-value">#{dashboardBean.nbClients}</p>
                        </div>
                    </div>
                </div>
                
                <!-- Dernières factures -->
                <p:panel header="Dernières Factures" style="margin-top: 20px;">
                    <p:dataTable value="#{dashboardBean.dernieresFactures}" 
                               var="facture"
                               emptyMessage="Aucune facture">
                        <p:column headerText="N° Facture">
                            <h:outputText value="#{facture.numeroFacture}"/>
                        </p:column>
                        
                        <p:column headerText="Client">
                            <h:outputText value="#{facture.client.nomComplet}"/>
                        </p:column>
                        
                        <p:column headerText="Date">
                            <h:outputText value="#{facture.dateFacture}" converter="localDateConverter"/>
                        </p:column>
                        
                        <p:column headerText="Montant TTC">
                            <h:outputText value="#{facture.montantTTC}">
                                <f:convertNumber type="currency" currencySymbol="€"/>
                            </h:outputText>
                        </p:column>
                        
                        <p:column headerText="Statut">
                            <h:outputText value="#{facture.statut.libelle}"
                                        styleClass="status-#{facture.statut}"/>
                        </p:column>
                    </p:dataTable>
                </p:panel>
                
                <!-- Top clients -->
                <p:panel header="Top 5 Clients" style="margin-top: 20px;">
                    <p:dataTable value="#{dashboardBean.topClients}" 
                               var="data"
                               emptyMessage="Aucun client">
                        <p:column headerText="Client">
                            <h:outputText value="#{data[0].nomComplet}"/>
                        </p:column>
                        
                        <p:column headerText="Email">
                            <h:outputText value="#{data[0].email}"/>
                        </p:column>
                        
                        <p:column headerText="Chiffre d'Affaires">
                            <h:outputText value="#{data[1]}">
                                <f:convertNumber type="currency" currencySymbol="€"/>
                            </h:outputText>
                        </p:column>
                    </p:dataTable>
                </p:panel>
            </p:panel>
        </h:form>
    </ui:define>
</ui:composition>
</html>
